[package]
name = "orbit-track"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Reproducible SGP4 satellite predictions and an offline ground-track map"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive"] }
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sgp4 = "=2.4.0"
sha2 = "0.10.9"
tokio = { version = "1.54.1", features = ["full"] }

[dev-dependencies]
tempfile = "3.27.0"
toml = "1.1.8"
tower = { version = "0.5.3", features = ["util"] }
